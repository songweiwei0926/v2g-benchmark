[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v2gbench"
version = "1.0.0"
description = "V2G-Benchmark-OneShot: Unified benchmark for regulatory variant-to-gene prediction"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "requests>=2.31",
    "aiohttp>=3.9",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "openpyxl>=3.1",
    "synapseclient>=4.0",
    "alphagenome>=0.8",
    "borzoi-pytorch>=0.5",
    "enformer-pytorch>=0.1",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0"]
r = ["rpy2>=3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
