# Context mapping configuration

# Ontology sources
ontologies:
  CL:
    name: "Cell Type Ontology"
    prefix: "CL:"
  UBERON:
    name: "Uber Anatomy Ontology"
    prefix: "UBERON:"
  EFO:
    name: "Experimental Factor Ontology"
    prefix: "EFO:"

# Mapping levels (applied in order)
mapping_levels:
  1:
    name: exact_ontology_id
    description: "Direct ontology ID match"
    confidence: 1.0
  2:
    name: normalized_exact_string
    description: "Normalized string match after lowercasing, stripping whitespace"
    confidence: 0.95
  3:
    name: synonym
    description: "Synonym match from ontology"
    confidence: 0.90
  4:
    name: ontology_parent_child_1
    description: "Ontology parent/child distance ≤ 1"
    confidence: 0.85
  5:
    name: ontology_distance_2
    description: "Ontology distance ≤ 2"
    confidence: 0.75
  6:
    name: published_sce2g_mapping
    description: "Published scE2G fine/coarse tissue mapping"
    confidence: 0.70

# Primary benchmark threshold
primary_min_confidence: 0.8

